services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - company_ai_local_postgres_data:/var/lib/postgresql
      - company_ai_local_backups:/companyai/backups
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - company_ai_local_network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: company-ai-backend:local
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-local-production}
      TZ: ${APP_TIMEZONE:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID}
      CREDENTIAL_ENCRYPTION_KEYRING: ${CREDENTIAL_ENCRYPTION_KEYRING}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENT_CREDENTIAL_PEPPER: ${AGENT_CREDENTIAL_PEPPER}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
      AGENT_JWT_ALGORITHM: ${AGENT_JWT_ALGORITHM:-HS256}
      AGENT_JWT_TTL_SECONDS: ${AGENT_JWT_TTL_SECONDS:-300}
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER:-company-ai}
      AGENT_JWT_AUDIENCE: ${AGENT_JWT_AUDIENCE:-company-ai-agent-runtime}
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - company_ai_local_network

  backend:
    image: company-ai-backend:local
    restart: unless-stopped
    init: true
    environment:
      APP_ENV: ${APP_ENV:-local-production}
      BACKEND_DEBUG: "false"
      TZ: ${APP_TIMEZONE:-UTC}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID: ${CREDENTIAL_ENCRYPTION_ACTIVE_KEY_ID}
      CREDENTIAL_ENCRYPTION_KEYRING: ${CREDENTIAL_ENCRYPTION_KEYRING}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      AGENT_CREDENTIAL_PEPPER: ${AGENT_CREDENTIAL_PEPPER}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
      AGENT_JWT_ALGORITHM: ${AGENT_JWT_ALGORITHM:-HS256}
      AGENT_JWT_TTL_SECONDS: ${AGENT_JWT_TTL_SECONDS:-300}
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER:-company-ai}
      AGENT_JWT_AUDIENCE: ${AGENT_JWT_AUDIENCE:-company-ai-agent-runtime}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-3}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-2}
      DATABASE_POOL_TIMEOUT: ${DATABASE_POOL_TIMEOUT:-30}
      DATABASE_CONNECT_TIMEOUT: ${DATABASE_CONNECT_TIMEOUT:-5}
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${BACKEND_WORKERS:-1}"
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 30s
    networks:
      - company_ai_local_network

  app:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: company-ai-frontend:local
    restart: unless-stopped
    ports:
      - "${LOCAL_APP_BIND_ADDRESS:-127.0.0.1}:${LOCAL_APP_PORT:-8080}:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-qO-",
          "http://127.0.0.1:8080/healthz"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 10s
    networks:
      - company_ai_local_network

volumes:
  company_ai_local_postgres_data:
    name: company_ai_local_postgres_data
  company_ai_local_backups:
    name: company_ai_local_backups
  company_ai_local_logs:
    name: company_ai_local_logs
  company_ai_local_config:
    name: company_ai_local_config

networks:
  company_ai_local_network:
    name: company_ai_local_network
    driver: bridge
