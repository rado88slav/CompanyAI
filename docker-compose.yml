services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "${POSTGRES_HOST_PORT}:${POSTGRES_PORT}"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -h 127.0.0.1 -p 5432"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    stop_grace_period: 30s

    networks:
      - company_ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: company-ai-backend:dev
    restart: unless-stopped
    init: true

    environment:
      APP_ENV: ${APP_ENV}
      TZ: ${APP_TIMEZONE}

      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      APP_SECRET_KEY: ${APP_SECRET_KEY}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}
      AGENT_CREDENTIAL_PEPPER: ${AGENT_CREDENTIAL_PEPPER}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET}
      AGENT_JWT_ALGORITHM: ${AGENT_JWT_ALGORITHM}
      AGENT_JWT_TTL_SECONDS: ${AGENT_JWT_TTL_SECONDS}
      AGENT_JWT_ISSUER: ${AGENT_JWT_ISSUER}
      AGENT_JWT_AUDIENCE: ${AGENT_JWT_AUDIENCE}

    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "${BACKEND_HOST}",
        "--port",
        "${BACKEND_PORT}"
      ]

    ports:
      - "${BACKEND_HOST_PORT}:${BACKEND_PORT}"

    depends_on:
      postgres:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3).read()"
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    stop_grace_period: 30s

    networks:
      - company_ai_network

volumes:
  postgres_data:
    name: company_ai_postgres_data

networks:
  company_ai_network:
    name: company_ai_network
    driver: bridge
